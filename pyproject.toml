[project]
name = "last30days-skill"
version = "3.6.0"
description = "Multi-source last-30-days research skill"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "actionlint-py>=1.7,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.8,<1",
  "shellcheck-py>=0.10,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "dist",
  "skills/last30days/scripts/lib/vendor",
]

[tool.ruff.lint]
# Baseline high-confidence failures first so CI catches broken Python without
# forcing a repository-wide style cleanup in the same change.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "-q",
  "--tb=short",
]

[tool.coverage.run]
branch = true
source = ["skills/last30days/scripts", "tests"]
omit = [
  "skills/last30days/scripts/lib/vendor/*",
  "dist/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
omit = [
  "skills/last30days/scripts/lib/vendor/*",
  "dist/*",
]
