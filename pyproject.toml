[project]
name = "last30days-skill"
version = "3.3.1"
description = "Multi-source last-30-days research skill"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15.14",
  "ty>=0.0.39",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  ".venv",
  "dist",
  "htmlcov",
  "skills/last30days/scripts/lib/vendor",
]

[tool.ruff.lint]
# Start with parser and high-confidence Pyflakes checks so the first CI ratchet
# catches real breakage without turning the current legacy style into noise.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.src]
exclude = [
  ".venv",
  "dist",
  "htmlcov",
  "skills/last30days/scripts/lib/vendor",
]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["skills/last30days/scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "-q",
  "--tb=short",
]

[tool.coverage.run]
branch = true
source = ["skills/last30days/scripts", "tests"]
omit = [
  "skills/last30days/scripts/lib/vendor/*",
  "dist/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
omit = [
  "skills/last30days/scripts/lib/vendor/*",
  "dist/*",
]
