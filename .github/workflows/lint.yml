name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  shell-and-actions:
    name: ShellCheck and actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl -fsSLo .tools/shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "${SHELLCHECK_SHA256}" ".tools/shellcheck.tar.xz" | sha256sum --check -
          tar -xJf .tools/shellcheck.tar.xz -C .tools
          echo "${PWD}/.tools/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      - name: Install actionlint
        run: |
          set -euo pipefail
          mkdir -p .tools/actionlint
          archive=".tools/actionlint/actionlint.tar.gz"
          curl -fsSLo "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C .tools/actionlint
          echo "${PWD}/.tools/actionlint" >> "$GITHUB_PATH"

      - name: ShellCheck repository scripts
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find . -type f -name '*.sh' -not -path './.venv/*' -print0)
          if ((${#scripts[@]})); then
            shellcheck "${scripts[@]}"
          fi

      - name: actionlint workflows
        run: actionlint

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Ruff safety lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format baseline
        continue-on-error: true
        run: uv run ruff format --check .

  ty:
    name: ty
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Python
        run: uv python install 3.12

      - name: ty advisory type check
        continue-on-error: true
        run: >
          uv run ty check
          --output-format github
          --python-version 3.12
          --extra-search-path skills/last30days/scripts
          --force-exclude
