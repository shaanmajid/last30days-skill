name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

env:
  UV_NO_CONFIG: "1"

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Ruff
        run: uv run --locked ruff check --output-format=github .

      - name: Run actionlint
        run: uv run --locked actionlint

      - name: Run shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' ':!:skills/last30days/scripts/lib/vendor/**')
          ((${#scripts[@]} == 0)) || uv run --locked shellcheck "${scripts[@]}"

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Run test suite
        run: uv run --locked pytest
